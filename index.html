<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <title></title>
    <link rel="stylesheet" href="styles.css">

  </head>
  <body>
    <div class="topBar">
      <button class="langButton">العربية</button>
      
      <div class="barItems">
        <br>
        <a href="#price" class="barItem barItem1"></a>
        <pre class="dots">●</pre>
        <a href="#availableLessons" class="barItem barItem2"></a>
        <pre class="dots">●</pre>
        <a href="#information" class="barItem barItem3"></a>
        <pre class="dots">●</pre>
        <a href="#contact-us" class="barItem barItem4"></a>

    <br><br><br><br><br>

        <li class="lessons lessons1"></li>
        <li class="lessons lessons2"></li>
        <li class="lessons lessons3"></li>

        <li class="info info4"></li>
        <li class="info info5"></li>

    </div>


    <div id="price" class="divs">
      <p class="prices1"></p>
      <p class="prices2 smaller"></p>
    </div>

    
    <div id="contact-us" class="divs">
      <ul>
        <p class="ulTitle contactTitle"></p>

        <li class="contact contact1"></li>
        <li class="contact contact2"></li>
      </ul>

    <footer></footer>

    <script src="lang.js"></script>
    <script src="javascript.js"></script>
